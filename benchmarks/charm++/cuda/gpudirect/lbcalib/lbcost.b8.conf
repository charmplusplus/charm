# DiffusionLB transfer-cost table, written by lbcalib.
# Pass to an application with +LBCostConfig /u/bhosale/charm-reconverse/benchmarks/charm++/cuda/gpudirect/lbcalib/lbcost.b8.conf
#
# 64 PEs, 4 device(s) per host, message sizes 64..4194304 bytes,
# 100 timed iterations after 20 warmup.
#
# alpha is seconds per message, beta seconds per byte.
#
# intra_process  measured (R2=0.9745)
# ipc_same_gpu   NOT MEASURED - copied from an adjacent tier (R2=0.0000)
# ipc_cross_gpu  measured (R2=0.9985)
# inter_node     measured (R2=0.9761)

devices_per_host = 4

intra_process_alpha = 1.667965237e-05
intra_process_beta  = 3.669212264e-12
ipc_same_gpu_alpha = 1.667965237e-05
ipc_same_gpu_beta  = 3.669212264e-12
ipc_cross_gpu_alpha = 3.021005653e-05
ipc_cross_gpu_beta  = 3.957688614e-11
inter_node_alpha = 5.543875331e-05
inter_node_beta  = 5.308409381e-11

# Migration: measured (R2=0.9983), batches of 8 objects migrating
# PE 0 <-> PE 8 (ipc_cross_gpu), per-object time = batch time / batch.
migrate_alpha       = 4.361926848e-05
migrate_beta_host   = 4.632473956e-10
migrate_beta_device = 4.758526673e-11

# How many balancer intervals a placement is assumed to last,
# used to amortise the one-off migration cost.
placement_lifetime_intervals = 4
