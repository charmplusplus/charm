# DiffusionLB transfer-cost table, written by lbcalib.
# Pass to an application with +LBCostConfig /u/bhosale/charm-reconverse/benchmarks/charm++/cuda/gpudirect/lbcalib/lbcost.a100.2n.chan.conf
#
# 8 PEs, 4 device(s) per host, message sizes 64..4194304 bytes,
# 200 timed iterations after 20 warmup.
#
# alpha is seconds per message, beta seconds per byte.
#
# intra_process  NOT MEASURED - copied from an adjacent tier (R2=0.0000)
# intra_process_peer NOT MEASURED - copied from an adjacent tier (R2=0.0000)
# ipc_same_gpu   NOT MEASURED - copied from an adjacent tier (R2=0.0000)
# ipc_cross_gpu  measured (R2=0.9845)
# inter_node     measured (R2=0.9999)

devices_per_host = 4

intra_process_alpha = 0.000000000e+00
intra_process_beta  = 0.000000000e+00
intra_process_peer_alpha = 0.000000000e+00
intra_process_peer_beta  = 0.000000000e+00
ipc_same_gpu_alpha = 3.539371984e-05
ipc_same_gpu_beta  = 9.644288548e-12
ipc_cross_gpu_alpha = 3.539371984e-05
ipc_cross_gpu_beta  = 9.644288548e-12
inter_node_alpha = 2.203699425e-05
inter_node_beta  = 5.175327229e-11

# A copy's exchange with one peer in a group of k copies exchanging all at once
# (by device channel puts, each its own batch;
# xchg_fan<k>: k PEs, one per device on one host / one per host, each sending
# 4194304..134217728 B to every other), alpha seconds per message, beta seconds per byte,
# per peer; 10 rounds after 2. A balancer prices a copy's k-1 peers with these.
xchg_fan2_host_alpha = 2.781751737e-05   # R2=1.0000
xchg_fan2_host_beta  = 1.071665299e-11
xchg_fan3_host_alpha = 1.722823328e-05   # R2=1.0000
xchg_fan3_host_beta  = 1.070247648e-11
xchg_fan4_host_alpha = 1.419923001e-05   # R2=1.0000
xchg_fan4_host_beta  = 1.072087753e-11
xchg_fan2_inter_alpha = 9.446357613e-06   # R2=0.9997
xchg_fan2_inter_beta  = 8.272221957e-11

# Migration: measured (R2=0.9858), batches of 32 objects migrating
# PE 0 <-> PE 1 (ipc_cross_gpu), per-object time = batch time / batch.
migrate_alpha       = 2.219108047e-05
migrate_beta_host   = 3.389214890e-10
migrate_beta_device = 1.800491336e-11

# How many balancer intervals a placement is assumed to last,
# used to amortise the one-off migration cost.
placement_lifetime_intervals = 4
