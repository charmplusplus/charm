# MEASURED ON TWO NODES 2026-09-15 (job 22109113, gpub063+gpub090).
# Supersedes lbcost.delta-a40.migrate.conf, whose inter_node tier was NOT
# measured -- it was copied from ipc_cross_gpu, which under-priced an
# off-node message by 1.8x in alpha and 1.4x in beta:
#     inter_node_alpha  2.559e-05 (copied)  ->  5.195e-05 (measured, R2=0.9885)
#     inter_node_beta   3.992e-11 (copied)  ->  5.421e-11 (measured)
# migrate_* here is a batch of 8, not the usual 32: a batch of 32 segfaults
# at the 1 MB device point on a 2-node launch. Less overlap per batch, so
# migrate_alpha is higher than the 1-node table's (5.60e-05 vs 2.90e-05).
# It remains a SAME-HOST move; an off-node migrate_* could not be measured
# because cross-node migration corrupts the heap in LCI's send-completion
# path (see the 2-node calibration notes).
#
# DiffusionLB transfer-cost table, written by lbcalib.
# Pass to an application with +LBCostConfig /u/bhosale/charm-reconverse/benchmarks/charm++/cuda/gpudirect/lbcalib/lbcost.2n.same.conf
#
# 64 PEs, 4 device(s) per host, message sizes 64..4194304 bytes,
# 200 timed iterations after 20 warmup.
#
# alpha is seconds per message, beta seconds per byte.
#
# intra_process  measured (R2=0.9745)
# ipc_same_gpu   NOT MEASURED - copied from an adjacent tier (R2=0.0000)
# ipc_cross_gpu  measured (R2=0.9989)
# inter_node     measured (R2=0.9885)

devices_per_host = 4

intra_process_alpha = 1.678710824e-05
intra_process_beta  = 3.662691025e-12
ipc_same_gpu_alpha = 1.678710824e-05
ipc_same_gpu_beta  = 3.662691025e-12
ipc_cross_gpu_alpha = 2.939249885e-05
ipc_cross_gpu_beta  = 3.975763403e-11
inter_node_alpha = 5.194932493e-05
inter_node_beta  = 5.420668311e-11

# Migration: measured (R2=0.9913), batches of 8 objects migrating
# PE 0 <-> PE 8 (ipc_cross_gpu), per-object time = batch time / batch.
migrate_alpha       = 5.601924047e-05
migrate_beta_host   = 3.766762051e-10
migrate_beta_device = 4.329692668e-11

# How many balancer intervals a placement is assumed to last,
# used to amortise the one-off migration cost.
placement_lifetime_intervals = 4
