# Answers questions about a design document in a pull request, and records
# feedback on it, with Claude (anthropics/claude-code-action).
#
# It runs only on pull requests labelled design-qa, only for comments that
# contain /design-qa, and only for people with write access to this repository.
# A comment can be on the conversation tab or on a line of the diff.
#
# The bot reads the pull request's branch, the reconverse submodule, the LCI
# sources that reconverse pins, charm-notes, and issues and pull requests through
# gh. It has no tool that edits files, and its token cannot push. Its
# instructions are .claude/design-qa/instructions.md; the action restores
# .claude/ from the base branch, so a pull request cannot change them.
#
# It needs the repository secret ANTHROPIC_API_KEY_DESIGN_QA.
name: design-qa

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: design-qa-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  answer:
    if: >-
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '/design-qa') &&
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(github.event.issue.labels.*.name, 'design-qa')) ||
       (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.pull_request.labels.*.name, 'design-qa')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Fetch the LCI sources reconverse pins, and charm-notes
        run: |
          tag=$(grep -A2 'set(RECONVERSE_AUTOFETCH_LCI2_TAG' contrib/reconverse/CMakeLists.txt | grep -o -m1 '[0-9a-f]\{40\}')
          echo "LCI $tag"
          git init -q "$RUNNER_TEMP/lci"
          git -C "$RUNNER_TEMP/lci" fetch -q --depth 1 https://github.com/uiuc-hpc/lci.git "$tag"
          git -C "$RUNNER_TEMP/lci" checkout -q FETCH_HEAD
          git clone -q --depth 1 https://github.com/charmplusplus/charm-notes.git "$RUNNER_TEMP/charm-notes"

      - uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_DESIGN_QA }}
          github_token: ${{ github.token }}
          trigger_phrase: /design-qa
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --max-turns 40
            --append-system-prompt-file ${{ github.workspace }}/.claude/design-qa/instructions.md
            --add-dir ${{ runner.temp }}/lci ${{ runner.temp }}/charm-notes
            --allowedTools "Bash(gh issue view:*)" "Bash(gh issue list:*)" "Bash(gh pr view:*)" "Bash(gh pr list:*)" "Bash(gh pr diff:*)" "Bash(gh search issues:*)" "Bash(gh search prs:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git grep:*)" "Bash(git blame:*)"
            --disallowedTools Edit Write NotebookEdit
