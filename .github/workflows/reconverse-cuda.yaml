name: reconverse-cuda

# Build-only CUDA gate for the reviewed line: compiling and linking CUDA
# needs the toolkit, not a GPU, and catches the whole build-time defect
# class (missing header installs, incomplete renames, cross-branch include
# leaks). Path-filtered so ordinary PRs keep the 5-minute CI; therefore
# advisory, NOT a required status check (a skipped required check would
# block unrelated PRs). Runtime GPU validation stays with the PR
# template's HPC-site field until a GPU runner exists (plan item 17).
#
# Two machine layers, because CUDA support is not a property of the GPU code
# alone: CMakeLists.txt forces RECONVERSE_ENABLE_CUDA so reconverse's
# GPU-aware loopback copies and LCI's GPUDirect registration come up with
# the same backend, and it appends `-L$CUDA_DIR/lib64/stubs -lcuda` to every
# charmc link line under reconverse+CUDA and nowhere else. None of that is
# reached by a netlrts build, so until the reconverse jobs below existed the
# device path this line's 9.x work targets -- d2dtest's own Makefile documents
# `reconverse-linux-x86_64-cuda` as its build root -- compiled only against
# the machine layer it is not meant to run on.

on:
  push:
    branches: [reviewed-with-reconverse]
    paths:
      - 'src/arch/cuda/**'
      # NOT 'tests/charm++/cuda/**' or 'examples/charm++/cuda/**': in GitHub's
      # filter-pattern syntax '+' means one-or-more of the preceding character,
      # so those patterns are rejected as invalid. charm++ is the only
      # tests/charm* and the only examples/charm* directory.
      - 'tests/charm*/cuda/**'
      # The examples this workflow compiles below: without these, a PR that
      # touches only the CUDA examples never triggers the job that builds them.
      - 'examples/charm*/cuda/**'
      - 'examples/ampi/cuda/**'
      # Same '+' caveat as above: benchmarks/charm++ is the only benchmarks/charm*.
      - 'benchmarks/charm*/cuda/**'
      - 'src/arch/common/conv-mach-cuda.*'
      - 'src/arch/common/special.sh'
      # The reconverse machine layers the jobs below build with `cuda`; their
      # conv-mach files set the link line those jobs are the only gate on.
      - 'src/arch/reconverse-linux-*/**'
      - 'src/ck-core/ckrdmadevice.*'
      - 'src/conv-core/conv-rdmadevice.*'
      # ckrdma.C routes device (D2D) completions, and xi-Parameter.C emits the
      # sender-side device call, so both can break the device path on their own.
      - 'src/ck-core/ckrdma.*'
      - 'src/xlat-i/xi-Parameter.C'
      - 'CMakeLists.txt'
      - 'cmake/**'
      # The reconverse submodule gitlink. Moving the reconverse pin used to
      # edit a file under cmake/ and so matched the line above; as a submodule
      # the bump is a change to this one path, and without it a reconverse
      # version bump would skip the CUDA job entirely.
      - 'contrib/reconverse'
      - '.gitmodules'
      - '.github/workflows/reconverse-cuda.yaml'
  pull_request:
    branches: [reviewed-with-reconverse]
    paths:
      - 'src/arch/cuda/**'
      # NOT 'tests/charm++/cuda/**' or 'examples/charm++/cuda/**': in GitHub's
      # filter-pattern syntax '+' means one-or-more of the preceding character,
      # so those patterns are rejected as invalid. charm++ is the only
      # tests/charm* and the only examples/charm* directory.
      - 'tests/charm*/cuda/**'
      # The examples this workflow compiles below: without these, a PR that
      # touches only the CUDA examples never triggers the job that builds them.
      - 'examples/charm*/cuda/**'
      - 'examples/ampi/cuda/**'
      # Same '+' caveat as above: benchmarks/charm++ is the only benchmarks/charm*.
      - 'benchmarks/charm*/cuda/**'
      - 'src/arch/common/conv-mach-cuda.*'
      - 'src/arch/common/special.sh'
      # The reconverse machine layers the jobs below build with `cuda`; their
      # conv-mach files set the link line those jobs are the only gate on.
      - 'src/arch/reconverse-linux-*/**'
      - 'src/ck-core/ckrdmadevice.*'
      - 'src/conv-core/conv-rdmadevice.*'
      # ckrdma.C routes device (D2D) completions, and xi-Parameter.C emits the
      # sender-side device call, so both can break the device path on their own.
      - 'src/ck-core/ckrdma.*'
      - 'src/xlat-i/xi-Parameter.C'
      - 'CMakeLists.txt'
      - 'cmake/**'
      # The reconverse submodule gitlink. Moving the reconverse pin used to
      # edit a file under cmake/ and so matched the line above; as a submodule
      # the bump is a change to this one path, and without it a reconverse
      # version bump would skip the CUDA job entirely.
      - 'contrib/reconverse'
      - '.gitmodules'
      - '.github/workflows/reconverse-cuda.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cuda-buildonly:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # reconverse is the contrib/reconverse submodule.
          submodules: true
      # The toolkit download, not the build, is what makes this job's wall time
      # swing: measured 2.1 / 15.2 / 51.0 minutes across three runs of the same
      # unchanged step, while every build step stayed within a minute of itself.
      # Two fixes, in order of how much they buy:
      #
      #  --no-install-recommends: nvidia-cuda-toolkit recommends nsight-compute
      #  (307 MB), nsight-systems (141 MB) and nvidia-visual-profiler (106 MB,
      #  plus a JRE) -- interactive profilers that a build-only job never runs.
      #  Dropping them roughly halves the download, to nvidia-cuda-dev (653 MB)
      #  plus the toolkit itself (84 MB).
      #
      #  Caching the .debs: what remains then comes off the Actions cache
      #  instead of an apt mirror, which is what removes the variance rather
      #  than just shrinking its worst case. The key carries the runner image
      #  version, so an image bump (different preinstalled packages, hence a
      #  different dependency set to download) starts a fresh cache rather than
      #  restoring an incomplete one.
      # ImageVersion is a runner-image environment variable, not something the
      # `env` expression context is guaranteed to carry, so read it in a step
      # and hand it over as an output rather than interpolating it directly.
      - name: cache key inputs
        id: keyinfo
        run: echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: cache cuda toolkit packages
        uses: actions/cache@v5
        with:
          path: ~/cuda-debs
          # Exact key only, no restore-keys: a partial match would restore a
          # deb set built for a different image and the install would fail.
          key: cuda-debs-${{ steps.keyinfo.outputs.image }}-nvidia-cuda-toolkit-v1
      - name: install cuda toolkit
        run: |
          set -e
          mkdir -p ~/cuda-debs/partial
          if ! ls ~/cuda-debs/*.deb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends -d \
              -o Dir::Cache::archives="$HOME/cuda-debs" nvidia-cuda-toolkit
            sudo chown -R "$(id -u):$(id -g)" ~/cuda-debs
          fi
          sudo apt-get install -y --no-install-recommends ~/cuda-debs/*.deb
      - name: cmake build (all-test)
        run: |
          ./build all-test netlrts-linux-x86_64 cuda -j4 -g
          test -f netlrts-linux-x86_64-cuda/lib/libhybridapi.a
          ! grep -r cudahybridapi netlrts-linux-x86_64-cuda/lib
      - name: cuda examples compile
        run: |
          export CUDATOOLKIT_HOME=/usr
          # This now reaches examples/charm++/cuda/gpudirect too: it was absent
          # from that Makefile's DIRS, so until stage 9.3 added it, every
          # GPU-direct example was staged into the build tree and then compiled
          # by nothing at all. They had in fact stopped compiling -- they still
          # set CkDeviceBufferPost::cuda_stream, which 9.1 renamed to
          # hapi_stream -- and no CI job noticed.
          make -j4 -C netlrts-linux-x86_64-cuda/examples/charm++/cuda OPTS="-g"
          # AMPI's CUDA example is the gate on hapi_functions.h staying
          # self-sufficient under AMPI's own include order.
          make -j4 -C netlrts-linux-x86_64-cuda/examples/ampi/cuda OPTS="-g"
      - name: cuda benchmarks compile
        # The GPU-direct latency/bandwidth benchmarks were never built by CI
        # either. They drive the same nocopydevice surface as the examples, from
        # a group rather than an array.
        run: |
          export CUDATOOLKIT_HOME=/usr
          make -j4 -C netlrts-linux-x86_64-cuda/benchmarks/charm++/cuda OPTS="-g"
      - name: hapitest compiles
        # The stage 9.1 acceptance test. Running it needs a GPU, but compiling
        # it is itself a check: hapitest.C is built by charmc, so this is the
        # gate on hapi_portable.h staying self-sufficient for user code.
        run: |
          make -j4 -C netlrts-linux-x86_64-cuda/tests/charm++/cuda/hapitest \
            GPU=cuda CUDATOOLKIT_HOME=/usr OPTS="-g"
      - name: d2dtest compiles
        # The stage 9.2 acceptance test. Running it needs GPUs on more than one
        # host to mean anything (see its README), but compiling it is the gate
        # on the nocopydevice entry-method surface: it drives two device
        # buffers in one entry method plus array, group and nodegroup proxies,
        # so a regression in the code charmxi emits for any of those shows up
        # here rather than at a reviewer's HPC site.
        run: |
          make -j4 -C netlrts-linux-x86_64-cuda/tests/charm++/cuda/d2dtest \
            GPU=cuda CUDATOOLKIT_HOME=/usr OPTS="-g"
      - name: gpumigrate compiles
        # Device-state migration. Running it needs a GPU, but compiling it
        # gates the PUPMode::DEVICE surface that application pup routines see,
        # and the nocopydevice entry method the migration payload travels on.
        run: |
          make -j4 -C netlrts-linux-x86_64-cuda/tests/charm++/cuda/gpumigrate \
            OPTS="-g"

      - name: legacy buildold path
        run: |
          rm -rf netlrts-linux-x86_64-cuda
          ./buildold charm++ netlrts-linux-x86_64 cuda -j4 -g
          test -L netlrts-linux-x86_64-cuda/include/hapi_portable.h || test -f netlrts-linux-x86_64-cuda/include/hapi_portable.h

  # The same build-only gate over the reconverse machine layer, which is the
  # one the 9.x device work is aimed at. A proper subset of cuda-buildonly's
  # steps, and deliberately not a copy of it:
  #
  #   * `./build charm++`, not `all-test`: AMPI rides on TCharm, and
  #     CMakeLists.txt still excludes TCharm from reconverse builds ("not yet
  #     ported to reconverse builds"), so there is no examples/ampi/cuda to
  #     compile on this side. When TCharm lands, add the target here and drop
  #     this note rather than widening `all-test` blindly.
  #   * no buildold leg: buildold does not mention reconverse anywhere, so the
  #     cmake path is the only path this machine layer has ever had.
  #
  # x86_64 and arm8 are one matrix because they differ only in runner, target
  # and where the CUDA toolkit comes from; -Werror=vla on arm8 carries over
  # from reconverse-ci.yaml's job of the same name. fail-fast is off so an
  # arm-side toolkit problem cannot mask the x86_64 result, which is the one
  # the device work lands against.
  #
  # The two legs do NOT share a toolkit, and the reason is a distro bug rather
  # than anything in this tree. Ubuntu noble's own nvidia-cuda-toolkit is CUDA
  # 12.0, and that nvcc cannot parse noble's own glibc 2.39 aarch64 headers:
  # /usr/include/aarch64-linux-gnu/bits/math-vector.h declares __SVFloat32_t,
  # __SVFloat64_t and __SVBool_t behind `#if __GNUC_PREREQ(10, 0) ||
  # __glibc_clang_prereq(11, 0)` -- a compiler-VERSION test, not an SVE feature
  # test -- so the block is taken for any host gcc >= 10, and nvcc's frontend
  # has no such builtin types. It fails in CMake's compiler-id probe, before a
  # line of Charm++ is reached, and no compile flag escapes it: the guard reads
  # only __GNUC__, and noble ships no gcc older than 12. So arm8 takes its
  # toolkit from NVIDIA's sbsa repo instead. 12.6 is the pin: new enough for
  # nvcc to know the SVE types, and the series Grace-class sites actually run.
  # x86_64 keeps the distro package, which works and is already cached.
  reconverse-cuda-buildonly:
    name: reconverse-cuda-buildonly (${{ matrix.target }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: reconverse-linux-x86_64
            runner: ubuntu-latest
            build_opts: ''
            nvidia_repo: ''
            cuda_pkgs: 'nvidia-cuda-toolkit'
            cuda_home: '/usr'
          - target: reconverse-linux-arm8
            runner: ubuntu-24.04-arm
            build_opts: '-Werror=vla'
            nvidia_repo: 'ubuntu2404/sbsa'
            # Only the four packages this job compiles and links against:
            # nvcc for the .cu files and LCI's enable_language(CUDA), cudart
            # and cupti for conv-mach-cuda.sh's -lcudart -lcupti, and
            # driver-dev for the libcuda stub that reconverse+CUDA links.
            # Deliberately not the cuda-toolkit-12-6 metapackage, which pulls
            # several GB of math libraries and profilers nothing here touches.
            cuda_pkgs: 'cuda-nvcc-12-6 cuda-cudart-dev-12-6 cuda-cupti-dev-12-6 cuda-driver-dev-12-6'
            cuda_home: '/usr/local/cuda-12.6'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          # reconverse is the contrib/reconverse submodule.
          submodules: true
      # Same toolkit-download variance and the same two fixes as cuda-buildonly
      # above; see that job for the measurements. matrix.target is in the key
      # on top of the image version because the two legs install different
      # package sets from different repos, and the arm and x86_64 images can
      # report the same ImageVersion.
      - name: cache key inputs
        id: keyinfo
        run: echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: cache cuda toolkit packages
        uses: actions/cache@v5
        with:
          path: ~/cuda-debs
          # Exact key only, no restore-keys: a partial match would restore a
          # deb set built for a different image and the install would fail.
          key: cuda-debs-${{ matrix.target }}-${{ steps.keyinfo.outputs.image }}-v2
      - name: install dependencies
        run: |
          set -e
          # libfabric is reconverse's transport; cmake is its only build path.
          sudo apt-get update
          sudo apt-get install -y cmake libfabric-dev
          if [ -n "${{ matrix.nvidia_repo }}" ]; then
            # Only reached on the leg whose distro nvcc cannot build at all
            # (see the job comment). The keyring package is what makes the
            # NVIDIA repo trusted; without it apt refuses the packages.
            curl -fsSL -o /tmp/cuda-keyring.deb \
              "https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.nvidia_repo }}/cuda-keyring_1.1-1_all.deb"
            sudo dpkg -i /tmp/cuda-keyring.deb
            sudo apt-get update
          fi
          mkdir -p ~/cuda-debs/partial
          if ! ls ~/cuda-debs/*.deb >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends -d \
              -o Dir::Cache::archives="$HOME/cuda-debs" ${{ matrix.cuda_pkgs }}
            sudo chown -R "$(id -u):$(id -g)" ~/cuda-debs
          fi
          sudo apt-get install -y --no-install-recommends ~/cuda-debs/*.deb
      # find_package(CUDAToolkit) locates nvcc on PATH. /usr/bin is already
      # there, so this is a no-op on x86_64 and the whole point on arm8.
      - name: put the cuda toolkit on PATH
        run: echo "${{ matrix.cuda_home }}/bin" >> "$GITHUB_PATH"
      # Informational, never fails the job. Under reconverse+CUDA -- and only
      # there -- CMakeLists.txt appends `-L$CUDA_DIR/lib64/stubs -lcuda` to
      # every charmc link line, because liblci.so calls the CUDA driver API
      # directly. CUDA_DIR comes from CUDAToolkit_TARGET_DIR, so on a distro
      # toolkit whose stubs sit somewhere other than $prefix/lib64/stubs that
      # -L resolves to nothing and every link below fails on -lcuda. Printing
      # the real layout here turns that into a one-line diagnosis in the same
      # run instead of an unexplained undefined-reference wall.
      - name: report cuda toolkit layout
        run: |
          echo "--- nvcc ---"
          command -v nvcc && nvcc --version || true
          echo "--- libcuda stubs visible to the linker ---"
          find /usr -name 'libcuda.so*' 2>/dev/null || true
          echo "--- candidate stub dirs ---"
          ls -d "${{ matrix.cuda_home }}"/lib64/stubs /usr/lib/*/stubs 2>/dev/null || true
          echo "--- CUPTI ---"
          ls -d "${{ matrix.cuda_home }}"/extras/CUPTI/include 2>/dev/null || true
      - name: cmake build
        run: |
          ./build charm++ ${{ matrix.target }} cuda -j4 -g ${{ matrix.build_opts }}
          test -f ${{ matrix.target }}-cuda/lib/libhybridapi.a
          ! grep -r cudahybridapi ${{ matrix.target }}-cuda/lib
      - name: cuda examples compile
        # No examples/ampi/cuda here: see the job comment (TCharm, hence AMPI,
        # is not built under reconverse).
        run: |
          export CUDATOOLKIT_HOME=${{ matrix.cuda_home }}
          make -j4 -C ${{ matrix.target }}-cuda/examples/charm++/cuda OPTS="-g"
      - name: cuda benchmarks compile
        run: |
          export CUDATOOLKIT_HOME=${{ matrix.cuda_home }}
          make -j4 -C ${{ matrix.target }}-cuda/benchmarks/charm++/cuda OPTS="-g"
      - name: hapitest compiles
        # Gate on hapi_portable.h staying self-sufficient for user code, now
        # with reconverse's headers in the include path rather than converse's.
        run: |
          make -j4 -C ${{ matrix.target }}-cuda/tests/charm++/cuda/hapitest \
            GPU=cuda CUDATOOLKIT_HOME=${{ matrix.cuda_home }} OPTS="-g"
      - name: d2dtest compiles
        # The reason this job exists. d2dtest drives two device buffers in one
        # entry method across array, group and nodegroup proxies, and the
        # nocopydevice code charmxi emits for them reaches reconverse's
        # setNcpyOpInfo -- the surface #3984 had to repair. Compiling it here
        # is the first time that pairing is checked anywhere in CI.
        run: |
          make -j4 -C ${{ matrix.target }}-cuda/tests/charm++/cuda/d2dtest \
            GPU=cuda CUDATOOLKIT_HOME=${{ matrix.cuda_home }} OPTS="-g"
      - name: gpumigrate compiles
        # PUPMode::DEVICE plus the nocopydevice entry method the migration
        # payload travels on.
        run: |
          make -j4 -C ${{ matrix.target }}-cuda/tests/charm++/cuda/gpumigrate \
            OPTS="-g"
